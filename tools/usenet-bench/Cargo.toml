[package]
name = "usenet-bench"
description = "Throughput benchmark for the usenet engine against the mock NNTP server, with per-machine baselines."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
cpu-time = "1.0.0"
fangst-bench = { path = "../fangst-bench" }
fangst-nntp = { path = "../../crates/fangst-nntp" }
fangst-nzb = { path = "../../crates/fangst-nzb" }
fangst-usenet = { path = "../../crates/fangst-usenet" }
fangst-yenc = { path = "../../crates/fangst-yenc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
