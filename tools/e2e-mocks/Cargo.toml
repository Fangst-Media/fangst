[package]
name = "e2e-mocks"
description = "Usenet server, tracker and torrent seeder for the adapter end-to-end tests in tests/adapters."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
fangst-bench = { path = "../fangst-bench" }
fangst-torrent = { path = "../../crates/fangst-torrent" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }

[lints]
workspace = true
