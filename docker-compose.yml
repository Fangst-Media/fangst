services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: fangst-sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - sabnzbd-config:/config
      - ./dev-data/incomplete:/config/Downloads/incomplete
      - ./dev-data/media:/config/Downloads/complete
    ports:
      - "8080:8080"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: fangst-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
      - WEBUI_PORT=8081
    volumes:
      - qbittorrent-config:/config
      - ./dev-data/incomplete:/downloads/incomplete
      - ./dev-data/media:/downloads
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: fangst-jellyfin
    environment:
      - TZ=Europe/Copenhagen
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./dev-data/media:/media:ro
    ports:
      - "8096:8096"
    restart: unless-stopped

  # fangst:
  #   build: .
  #   container_name: fangst
  #   environment:
  #     - TZ=Europe/Copenhagen
  #   volumes:
  #     - ./dev-data/media:/media
  #   ports:
  #     - "5001:5001"
  #   restart: unless-stopped

volumes:
  sabnzbd-config:
  qbittorrent-config:
  jellyfin-config:
  jellyfin-cache:
