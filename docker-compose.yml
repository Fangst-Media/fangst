services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: jaeger-sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - sabnzbd-config:/config
      - ./dev-data/incomplete:/incomplete
      - ./dev-data/media:/media
    ports:
      - "8080:8080"
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jaeger-jellyfin
    environment:
      - TZ=Europe/Copenhagen
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./dev-data/media:/media:ro
    ports:
      - "8096:8096"
    restart: unless-stopped

  # jaeger:
  #   build: .
  #   container_name: jaeger
  #   environment:
  #     - TZ=Europe/Copenhagen
  #   volumes:
  #     - ./dev-data/media:/media
  #   ports:
  #     - "5001:5001"
  #   restart: unless-stopped

volumes:
  sabnzbd-config:
  jellyfin-config:
  jellyfin-cache:
