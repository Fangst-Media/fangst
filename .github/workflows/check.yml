name: check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: just check-full (${{ matrix.os }})
    # Pull requests from branches in this repo already ran on push; only forks need the PR run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # changesetter compares the branch with main to find its changesets.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,changesetter@0.7.0

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # The browser download is keyed on the Playwright version, which is what decides the Chromium build.
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(bun --print 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Runs on a cache hit too: Linux needs the system libraries, which the cache does not hold.
      - name: Install Chromium for the smoke test
        working-directory: web
        run: bun x playwright install --with-deps chromium

      - name: Full gate
        run: just check-full
