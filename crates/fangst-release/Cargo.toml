[package]
name = "fangst-release"
description = "Release-name parsing: title, year, episode, resolution, source, codecs, HDR, group tier and a quality score."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true
keywords = ["release", "parser", "scene", "usenet", "torrent"]

[dependencies]
# Unicode tables are left out: every pattern runs with ASCII semantics on purpose.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1.0.154"

[lints]
workspace = true
