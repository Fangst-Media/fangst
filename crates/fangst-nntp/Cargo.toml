[package]
name = "fangst-nntp"
description = "Async NNTP client with TLS, pipelining and a per-server connection pool."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true
keywords = ["nntp", "usenet"]

[lints]
workspace = true

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
fangst-bench = { path = "../../tools/fangst-bench" }
fangst-yenc = { path = "../fangst-yenc" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
