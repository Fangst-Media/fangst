[package]
name = "fangst-dl-api"
description = "The native HTTP API of the Fangst download daemon."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
fangst-downloads = { version = "0.1.0", path = "../fangst-downloads" }
fangst-nntp = { version = "0.1.0", path = "../fangst-nntp" }
fangst-providers = { version = "0.1.0", path = "../fangst-providers" }
form_urlencoded = "1.2.3"
# Already in the tree through librqbit with the same rustls backend; no system proxy, so a
# fetch goes where its URL says.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "macros"] }
utoipa = "6.0.0"

[dev-dependencies]
fangst-bench = { path = "../../tools/fangst-bench" }
fangst-core = { path = "../fangst-core" }
fangst-nntp = { path = "../fangst-nntp" }
fangst-providers = { path = "../fangst-providers" }
fangst-usenet = { path = "../fangst-usenet" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
