[package]
name = "fangst-notify-ntfy"
description = "Notifier that publishes events to an ntfy topic."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fangst-providers = { version = "0.1.0", path = "../fangst-providers" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
fangst-bench = { path = "../../tools/fangst-bench" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
