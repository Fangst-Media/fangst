[package]
name = "fangst-torrent"
description = "Downloads magnet links and .torrent files: the BitTorrent engine behind the download queue."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
fangst-bench = { path = "../../tools/fangst-bench" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util"] }
