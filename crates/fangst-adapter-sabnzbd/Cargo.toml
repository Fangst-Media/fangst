[package]
name = "fangst-adapter-sabnzbd"
description = "Speaks the part of the SABnzbd API that Sonarr, Radarr and similar clients call, on top of the Fangst job queue."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fangst-providers = { version = "0.1.0", path = "../fangst-providers" }
form_urlencoded = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
