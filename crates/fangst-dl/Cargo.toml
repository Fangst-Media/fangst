[package]
name = "fangst-dl"
description = "The Fangst download daemon."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
fangst-core = { version = "0.1.0", path = "../fangst-core" }
fangst-dl-api = { version = "0.1.0", path = "../fangst-dl-api" }
fangst-downloads = { version = "0.1.0", path = "../fangst-downloads" }
fangst-nntp = { version = "0.1.0", path = "../fangst-nntp" }
fangst-nzb = { version = "0.1.0", path = "../fangst-nzb" }
fangst-providers = { version = "0.1.0", path = "../fangst-providers" }
fangst-usenet = { version = "0.1.0", path = "../fangst-usenet" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
fangst-bench = { path = "../../tools/fangst-bench" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
