[package]
name = "fangst-postproc-extract"
description = "Safety check and extraction of RAR and 7z archives in a downloaded job folder."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.0"
fangst-core = { version = "0.1.0", path = "../fangst-core" }
fangst-providers = { version = "0.1.0", path = "../fangst-providers" }
rar-rs = "0.15.3"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "ppmd"] }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
