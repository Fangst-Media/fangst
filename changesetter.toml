# Fangst ships as one app, so every shipped package shares one version.
# New crates join the fixed group when they are created; layercheck keeps the layer map, this keeps the version.

# "" is the root Cargo.toml: a virtual workspace with no package, which changesetter 0.7.0 still
# lists. "fangst" is the private Bun workspace root. layercheck and fangst-bench are dev tools. The old TypeScript
# packages are replaced in milestone 2 and are never released.
# Entries are package names; paths are silently ignored.
ignore = ["", "fangst", "layercheck", "fangst-bench", "@fangst/api", "@fangst/shared", "@fangst/parser"]

[groups.fangst]
fixed = ["fangst-adapter-sabnzbd", "fangst-core", "fangst-dl", "fangst-dl-api", "fangst-downloads", "fangst-nntp", "fangst-notify-discord", "fangst-notify-ntfy", "fangst-notify-webhook", "fangst-nzb", "fangst-providers", "fangst-release", "fangst-torrent", "fangst-usenet", "fangst-yenc", "@fangst/web"]

[changelog]
file = "CHANGELOG.md"
per_package = false
group = true
none_bump = "section"
none_bump_heading = "Internal"

[tag]
format = "v{version}"

[release]
commit_message = "chore: release {versions}"
tag_annotated = true

# The OpenAPI document carries the version, so a release has to regenerate it.
[hooks]
post_bump = ["cargo run --quiet -p fangst-dl -- openapi openapi/dl.json"]
