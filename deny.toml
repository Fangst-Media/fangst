# Workspace-wide dependency rules. The stricter rule that layer 0 crates take only permissive
# dependencies is per crate, which cargo-deny can't express, so tools/layercheck enforces it.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # ringbuf 0.4 double free in Consumer::skip, only when an element's Drop panics. It comes in
    # through librqbit-utp, which stores u8 (no Drop), so it can't trigger here. Remove with #89.
    { id = "RUSTSEC-2026-0293", reason = "librqbit-utp only stores u8, which has no Drop; tracked in #89" },
]

[licenses]
confidence-threshold = 0.9
# Every licence here is compatible with shipping the app under AGPL-3.0-or-later.
# RAR extraction (#19) uses rar-rs (BSD-2-Clause) instead of rarpar, so no GPL-3.0 entry is
# needed yet; docs/decisions/0006-archive-extraction.md says why.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Permissive data licence of the CA root bundle (webpki-root-certs, via librqbit's HTTPS trackers).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
