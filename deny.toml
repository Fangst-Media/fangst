# Workspace-wide dependency rules. The stricter rule that layer 0 crates take only permissive
# dependencies is per crate, which cargo-deny can't express, so tools/layercheck enforces it.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
# Every licence here is compatible with shipping the app under AGPL-3.0-or-later.
# GPL-3.0 joins this list together with the first crate that needs it (rarpar, #19).
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
