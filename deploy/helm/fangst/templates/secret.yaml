{{- if and (not .Values.apiKey.existingSecret) .Values.apiKey.value }}
{{- if lt (len .Values.apiKey.value) 16 }}
{{- fail "apiKey.value must be at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fangst.fullname" . }}
  labels:
    {{- include "fangst.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.apiKey.secretKey }}: {{ .Values.apiKey.value | b64enc | quote }}
{{- end }}
